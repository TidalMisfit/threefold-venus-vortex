<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Threefold Venus Vortex</title><style> *{box-sizing:border-box}body{margin:0;background:#090910;color:#f6e6cf;font:15px system-ui;text-align:center}main{max-width:760px;margin:auto;padding:24px}h1{font:36px Georgia;margin:12px 0}p{color:#b9a99e}canvas{width:100%;max-width:650px;display:block;margin:auto}section{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:left;background:#15141d;padding:20px;border-radius:16px}label{display:block}input[type=range]{width:100%;accent-color:#e9b579}button{background:#e9b579;color:#19121a;border:0;padding:12px 24px;border-radius:24px;font-weight:bold;cursor:pointer}output{float:right}small{color:#b9a99e} @media(max-width:480px){section{grid-template-columns:1fr}h1{font-size:28px}}</style><main><h1>The Threefold Venus Vortex</h1><p>A moving study of Venus geometry, threefold motion and inward circulation.</p><canvas id="v" width="700" height="700"></canvas><button id="play">Play animation</button> <button id="reset">Reset</button><p><small>Adjust the motion or reveal the underlying geometry.</small></p><section id="controls"></section><p><small>A symbolic visualization of a personal multidimensional image, not a physical simulation.</small></p></main><script>
const c=document.getElementById('v'),g=c.getContext('2d'),TAU=Math.PI*2,period=Math.PI/15;
const defaults={speed:1.8,swirl:1,flame:2,reach:1.4,trails:1,inflow:1,sync:true,guides:true,contacts:true};let o={...defaults},running=false,t=0,clock=0,flow=0,phase=0,last=0,frame=0;
const sprite=document.createElement('canvas');sprite.width=sprite.height=64;const s=sprite.getContext('2d'),gr=s.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,245,215,1)');gr.addColorStop(.25,'rgba(255,191,110,.5)');gr.addColorStop(1,'rgba(255,155,65,0)');s.fillStyle=gr;s.fillRect(0,0,64,64);
function glow(x,y,r,a){g.globalAlpha=Math.max(0,Math.min(1,a));g.drawImage(sprite,x-r,y-r,2*r,2*r);g.globalAlpha=1}
function p(a){return [275*Math.cos(5*a)*Math.cos(a),275*Math.cos(5*a)*Math.sin(a)]}function vertices(t){return [0,1,2].map(k=>p(((t+k*Math.PI/3)%Math.PI+Math.PI)%Math.PI))}
const guide=document.createElement('canvas');guide.width=guide.height=700;const h=guide.getContext('2d');h.translate(350,350);h.beginPath();for(let i=0;i<=700;i++){let a=i/700*Math.PI,r=110*Math.cos(5*a);i?h.lineTo(r*Math.cos(a),r*Math.sin(a)):h.moveTo(r*Math.cos(a),r*Math.sin(a))}h.strokeStyle='#bd83ad88';h.lineWidth=1;h.stroke();h.beginPath();for(let i=0;i<=1400;i++){let a=i/1400*Math.PI*10,x=.4*(160*Math.cos(a)-115*Math.cos(1.6*a)),y=.4*(160*Math.sin(a)-115*Math.sin(1.6*a));i?h.lineTo(x,y):h.moveTo(x,y)}h.strokeStyle='#a18be099';h.stroke();
function angle(){if(!o.sync)return phase;let f=((t%period)+period)%period/period,bend=Math.max(-.9,Math.min(.9,(o.swirl-1)*.45));return 6*t+bend*Math.sin(TAU*f)/5}
function spiral(u,k){let outer=180*o.reach,r=4+u*(outer-4),pivot=106/(outer-4),a=angle()+k*TAU/5-5.8*(Math.pow(u,1.7)-Math.pow(pivot,1.7));return [r*Math.cos(a),r*Math.sin(a)]}
function draw(){g.fillStyle='#090910';g.fillRect(0,0,700,700);g.save();g.translate(350,350);g.globalCompositeOperation='screen';glow(0,0,130,.18);for(let k=0;k<5;k++){for(let j=0;j<100;j++){let u=j/99,q=spiral(u,k),fade=Math.pow(1-u,.8);glow(q[0],q[1],6+u*10,.11*fade);glow(q[0],q[1],2+u*3,.20*fade)}for(let j=0;j<12;j++){let u=1-((flow+j/12)%1);for(let l=0;l<7;l++){let f=l/6,uu=u+f*.045;if(uu>1)continue;let q=spiral(uu,k);glow(q[0],q[1],3.5+f*2,.48*(1-f)*Math.sin(Math.PI*uu))}}}g.save();g.scale(.4,.4);let count=Math.round(65*o.trails);for(let j=count;j>=0;j--){let v=vertices(t-j*.006);g.beginPath();v.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.strokeStyle=j?`rgba(255,154,70,${.045*(1-j/(count+1))})`:'#ffe4b5';g.lineWidth=j?3+j*.13:2.5;g.stroke()}g.restore();for(let k=0;k<36;k++){let a=k*TAU/36,ph=k*2.399,height=(12+85*Math.pow(.5+.5*Math.sin(clock*1.1+ph),3))*o.flame,strength=.5+.5*Math.sin(clock*.8+ph);for(let j=0;j<20;j++){let u=j/19,r=110+height*u,bend=.35*Math.sin(u*5-clock*1.6+ph)*u+.15*Math.sin(clock*.4+ph)*u;glow(r*Math.cos(a+bend),r*Math.sin(a+bend),3+u*10,.17*o.flame*strength*Math.pow(1-u,1.8))}}if(o.contacts){g.beginPath();g.arc(0,0,110,0,TAU);g.strokeStyle='#ffffff55';g.lineWidth=1;g.stroke();for(let k=0;k<5;k++){let a=angle()+k*TAU/5;g.beginPath();g.arc(110*Math.cos(a),110*Math.sin(a),3,0,TAU);g.fillStyle='#a7d9ff';g.fill()}for(let v of vertices(t)){if(Math.hypot(...v)*.4>107){let x=v[0]*.4,y=v[1]*.4;glow(x,y,18,.8);g.beginPath();g.arc(x,y,5,0,TAU);g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke()}}}g.restore();if(o.guides)g.drawImage(guide,0,0)}
function loop(now){frame=0;if(!running)return;if(now-last>=40){let dt=Math.min((now-last)/1000,.06);last=now;t+=dt*o.speed*.45;clock+=dt;phase+=dt*o.swirl*.69;flow+=dt*o.swirl*.216*o.inflow;draw()}frame=requestAnimationFrame(loop)}
const controls=document.getElementById('controls');function build(){controls.replaceChildren();for(const [key,name,min,max,step] of [['speed','Triangle speed',.1,20,.1],['swirl','Vortex speed',.1,10,.1],['inflow','Inward pull',.1,3,.1],['reach','Spiral reach',1,1.7,.05],['flame','Independent flames',0,2.5,.05],['trails','Core light trails',0,3,.05],['sync','Synchronize boundary intersections'],['guides','Reveal Venus geometry'],['contacts','Highlight contact points']]){let l=document.createElement('label'),i=document.createElement('input');if(min===undefined){i.type='checkbox';i.checked=o[key];l.append(i,' '+name);i.onchange=()=>{if(key==='sync'&&o.sync&&!i.checked)phase=angle();o[key]=i.checked;draw()}}else{l.textContent=name;let out=document.createElement('output');out.textContent=o[key];l.append(out);i.type='range';i.min=min;i.max=max;i.step=step;i.value=o[key];l.append(i);i.oninput=()=>{o[key]=Number(i.value);out.textContent=i.value;draw()}}controls.append(l)}}
document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'Pause animation':'Play animation';if(running){last=performance.now();frame=requestAnimationFrame(loop)}else if(frame){cancelAnimationFrame(frame);frame=0}};document.getElementById('reset').onclick=()=>{o={...defaults};t=clock=flow=phase=0;build();draw()};build();draw();</script></html>
